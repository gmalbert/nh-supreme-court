name: Weekend React UI Validation

on:
  workflow_dispatch:
  schedule:
    # Weekend off-hours, after the Friday 9 PM ET local refresh window.
    - cron: "0 14 * * 6"  # Saturday 14:00 UTC
    - cron: "0 14 * * 0"  # Sunday 14:00 UTC

permissions:
  contents: read

jobs:
  react-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-runtime.txt pytest pytest-mock

      - name: Validate committed oral-argument data
        run: |
          # The complete transcript archive is generated locally and is not part
          # of the Git checkout. Validate the committed, deployable indexes here.
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("data/processed")
          arguments = json.loads((data_dir / "oral_arguments.json").read_text(encoding="utf-8"))
          stats = json.loads((data_dir / "oral_argument_stats.json").read_text(encoding="utf-8"))
          required = {
              "case_number", "argument_date", "duration_seconds", "word_count", "words_per_minute"
          }

          assert isinstance(arguments, list) and arguments, "oral_arguments.json must be a non-empty array"
          assert isinstance(stats, list), "oral_argument_stats.json must be an array"
          assert all(isinstance(row, dict) and set(row) == required for row in stats), (
              "oral_argument_stats.json has an invalid public schema"
          )
          assert {str(row.get("case_number", "")) for row in stats} == {
              str(row.get("case_number", "")) for row in arguments
          }, "oral_argument_stats.json docket coverage is stale"
          PY

      - name: Validate React API and release installer
        run: python -m pytest tests/test_react_api.py tests/test_runtime_release.py tests/test_release_installer.py -q

      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: webapp/frontend
        run: npm run build

      - name: Test Cloudflare proxy
        run: node --test webapp/frontend/tests/proxy.test.js
