name: Weekend UI Validation

on:
  workflow_dispatch:
  schedule:
    # Weekend off-hours, after the Friday 9 PM ET local refresh window.
    - cron: "0 14 * * 6"  # Saturday 14:00 UTC
    - cron: "0 14 * * 0"  # Sunday 14:00 UTC

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate oral-argument data
        run: python scripts/refresh_oral_arguments.py --check --archive-root .archive-not-present

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Start Streamlit
        run: |
          python -m streamlit run cases.py --server.port 8504 --server.headless true > streamlit-ui.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8504/_stcore/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit-ui.log
          exit 1

      - name: Run UI validation
        run: python validate_ui.py

      - name: Upload UI validation results
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-${{ github.run_id }}
          path: |
            data/raw/playwright_results.json
            streamlit-ui.log
            logs/
          if-no-files-found: warn
