name: Weekend UI Validation

on:
  workflow_dispatch:
  schedule:
    # Weekend off-hours, after the Friday 9 PM ET local refresh window.
    - cron: "0 14 * * 6"  # Saturday 14:00 UTC
    - cron: "0 14 * * 0"  # Sunday 14:00 UTC

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate committed oral-argument data
        run: |
          # The complete transcript archive is generated locally and is not part
          # of the Git checkout.  Validate the two committed, deployable indexes
          # here; full artifact validation runs where that archive is available.
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("data/processed")
          arguments = json.loads((data_dir / "oral_arguments.json").read_text(encoding="utf-8"))
          stats = json.loads((data_dir / "oral_argument_stats.json").read_text(encoding="utf-8"))
          required = {
              "case_number", "argument_date", "duration_seconds", "word_count", "words_per_minute"
          }

          assert isinstance(arguments, list) and arguments, "oral_arguments.json must be a non-empty array"
          assert isinstance(stats, list), "oral_argument_stats.json must be an array"
          assert all(isinstance(row, dict) and set(row) == required for row in stats), (
              "oral_argument_stats.json has an invalid public schema"
          )
          assert {str(row.get("case_number", "")) for row in stats} == {
              str(row.get("case_number", "")) for row in arguments
          }, "oral_argument_stats.json docket coverage is stale"
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Start Streamlit
        run: |
          python -m streamlit run cases.py --server.port 8504 --server.headless true > streamlit-ui.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8504/_stcore/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit-ui.log
          exit 1

      - name: Run UI validation
        run: python validate_ui.py

      - name: Upload UI validation results
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-${{ github.run_id }}
          path: |
            data/raw/playwright_results.json
            streamlit-ui.log
            logs/
          if-no-files-found: warn
