name: React and FastAPI validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements-runtime.txt pytest pytest-mock
      - name: Validate Oracle API release installer shell syntax
        run: |
          bash -n deploy/nhsc-api-release
          bash -n deploy/nhsc-release
      - name: Validate API and release installer
        run: python -m pytest tests/test_react_api.py tests/test_runtime_release.py tests/test_release_installer.py -q
      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci
      - name: Build React frontend
        working-directory: webapp/frontend
        run: npm run build
      - name: Test Cloudflare proxy
        run: node --test webapp/frontend/tests/proxy.test.js
